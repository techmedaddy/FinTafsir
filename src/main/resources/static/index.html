<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTafsir PDF Upload</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <h1>📄 FinTafsir</h1>
        <form id="uploadForm">
            <label for="fileInput">Upload PDF:</label>
            <input type="file" name="file" id="fileInput" accept=".pdf" required title="Choose a PDF file to upload" />
            <button type="submit">Upload & Parse</button>
        </form>
        <pre id="resultBox"></pre>
    </div>
    <script src="script.js"></script>
</body>

</html>
